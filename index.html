<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>瑞士16日遊 - 行程視覺化</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://unpkg.com/mappa-mundi@0.0.5/dist/mappa.js"></script>
    <script src="data.js"></script>
    <script src="sketch.js"></script>
  </head>
  <body>
    <div id="container">
      <h1>瑞士16日遊 - 2025年9月13-26日</h1>
      <div class="main-layout">
        <div class="map-section">
          <div id="map-container">
            <!-- 導覽控制面板 -->
            <div id="tour-guide" class="tour-guide">
              <button id="start-tour" class="tour-button">導覽行程</button>
              <div class="tour-nav-buttons">
                <button id="prev-step" class="tour-nav-button" disabled>
                  <i class="fas fa-arrow-left"></i>
                </button>
                <button id="next-step" class="tour-nav-button">
                  <i class="fas fa-arrow-right"></i>
                </button>
              </div>
              <div id="tour-content" class="tour-content"></div>
            </div>
          </div>
          <ul id="timeline"></ul>
        </div>
        <div class="info-section">
          <div id="daily-details" class="scrollable-content"></div>
          <div id="important-notes" class="scrollable-content"></div>
        </div>
      </div>
    </div>
  </body>
</html>
